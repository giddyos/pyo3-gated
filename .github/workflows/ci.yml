name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.90.0

jobs:
  rust:
    name: Rust 1.90
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: rust-1.90
          cache-on-failure: true

      - name: Install cargo-expand
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand

      - name: Check workspace
        run: scripts/check.sh

      - name: Verify generated stubs
        run: scripts/stub-check.sh

      - name: Check PyO3 compatibility tree
        run: |
          cargo tree -d --workspace --features stub-gen
          cargo tree --workspace --features stub-gen -i pyo3
          versions="$(cargo tree --workspace --features stub-gen -i pyo3 | sed -n 's/^pyo3 v\([^ ]*\).*/\1/p' | sort -u)"
          count="$(printf '%s\n' "$versions" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            printf 'expected exactly one pyo3 version, found:\n%s\n' "$versions"
            exit 1
          fi

      - name: Package macros
        run: cargo package -p pyo3-gated-macros --allow-dirty

      - name: Package facade
        run: |
          set +e
          output="$(cargo package -p pyo3-gated --allow-dirty 2>&1)"
          package_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$package_status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s\n' "$output" | grep -q 'no matching package named `pyo3-gated-macros` found'; then
            echo "Skipping facade package verification until pyo3-gated-macros is present in the crates.io index."
            exit 0
          fi
          exit "$package_status"

  python:
    name: Python smoke
    runs-on: ubuntu-latest

    env:
      # Force maturin/cargo to reuse the repo-level target dir so rust-cache can
      # restore/save it consistently instead of creating examples/color-module/target.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: python-smoke-1.90
          cache-on-failure: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build example wheel
        run: maturin build --out ../../dist
        working-directory: examples/color-module

      - name: Install example wheel
        run: python -m pip install dist/*.whl

      - name: Smoke test example module
        run: |
          python - <<'PY'
          import color_module

          c = color_module.Color(1, 2, 3)
          assert c.to_hex() == "#010203"
          assert color_module.add(1, 2) == 3
          assert color_module.Palette.Red == color_module.Palette.Red
          PY
