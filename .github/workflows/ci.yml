name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  rust:
    name: Rust (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, "1.85.0"]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo install cargo-expand --locked
        if: matrix.rust == 'stable'
      - run: cargo test --workspace
      - run: cargo doc --workspace --all-features --no-deps
      - run: cargo package -p pyo3-gated-macros --allow-dirty
      - name: Package facade
        run: |
          set +e
          output="$(cargo package -p pyo3-gated --allow-dirty 2>&1)"
          package_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$package_status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s\n' "$output" | grep -q 'no matching package named `pyo3-gated-macros` found'; then
            echo "Skipping facade package verification until pyo3-gated-macros is present in the crates.io index."
            exit 0
          fi
          exit "$package_status"

  python:
    name: Python smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install maturin
      - run: maturin build --out ../../dist
        working-directory: examples/color-module
      - run: python -m pip install dist/*.whl
      - run: |
          python - <<'PY'
          import color_module

          c = color_module.Color(1, 2, 3)
          assert c.to_hex() == "#010203"
          assert color_module.add(1, 2) == 3
          assert color_module.Palette.Red == color_module.Palette.Red
          PY
