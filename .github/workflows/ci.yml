name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.90.0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  rust:
    name: Rust 1.90 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: rust-1.90-python-${{ matrix.python-version }}
          cache-on-failure: true

      - name: Install cargo-expand
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Check workspace
        env:
          PYO3_PYTHON: python
        run: scripts/check.sh

      - name: Verify generated stubs
        env:
          PYO3_PYTHON: python
        run: scripts/stub-check.sh

      - name: Check PyO3 compatibility tree
        run: |
          cargo tree -d --workspace --features stub-gen
          cargo tree --workspace --features stub-gen -i pyo3
          cargo tree -p facade-pyo3-user --features python -i pyo3
          versions="$(cargo tree --workspace --features stub-gen -i pyo3 | sed -n 's/^pyo3 v\([^ ]*\).*/\1/p' | sort -u)"
          count="$(printf '%s\n' "$versions" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            printf 'expected exactly one pyo3 version, found:\n%s\n' "$versions"
            exit 1
          fi

      - name: Package macros
        run: cargo package -p pyo3-gated-macros --allow-dirty

      - name: Package facade
        run: |
          set +e
          output="$(cargo package -p pyo3-gated --allow-dirty 2>&1)"
          package_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$package_status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s\n' "$output" | grep -q 'no matching package named `pyo3-gated-macros` found'; then
            echo "Skipping facade package verification until pyo3-gated-macros is present in the crates.io index."
            exit 0
          fi
          exit "$package_status"

  python:
    name: Python smoke ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: python-smoke-1.90-${{ matrix.python-version }}
          cache-on-failure: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Generate stubs
        working-directory: examples/color-module
        run: cargo run --features stub-gen --bin stub_gen

      - name: Debug - list files after stub generation
        if: always()
        working-directory: examples/color-module
        run: |
          echo "::group::Files in examples/color-module"
          find . -maxdepth 3 -type f | sort
          echo "::endgroup::"
          echo "::group::Any .pyi files found anywhere in repo"
          find "${GITHUB_WORKSPACE}" -name "*.pyi" -not -path "*/target/*"
          echo "::endgroup::"

      - name: Build example wheel
        run: maturin build --out ../../dist --verbose
        working-directory: examples/color-module

      - name: Debug - inspect built wheel contents
        if: always()
        run: |
          echo "::group::Wheel files in dist/"
          ls -la dist/
          echo "::endgroup::"
          for whl in dist/*.whl; do
            echo "::group::Contents of $whl"
            python -m zipfile -l "$whl"
            echo "::endgroup::"
          done

      - name: Verify wheel stubs
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as z:
              names = set(z.namelist())

          print(f"Inspecting wheel: {wheel}")
          print("Full contents:")
          for n in sorted(names):
              print(f"  {n}")

          so_file = next(
              (n for n in names
               if n.startswith("color_module/color_module.cpython-")
               and n.endswith("-linux-gnu.so")),
              None,
          )
          assert so_file is not None, f"No .so found. Wheel contents:\n{sorted(names)}"
          print(f"Found .so: {so_file}")

          pyi_files = [n for n in names if n.startswith("color_module/") and n.endswith(".pyi")]
          assert pyi_files, f"No .pyi stub found anywhere. Wheel contents:\n{sorted(names)}"
          print(f"Found .pyi files: {pyi_files}")
          PY

      - name: Install example wheel
        run: python -m pip install dist/*.whl --force-reinstall

      - name: Debug - inspect installed package
        if: always()
        run: |
          echo "::group::Installed package location"
          python -c "import color_module; print(color_module.__file__)"
          echo "::endgroup::"
          echo "::group::Files in installed package directory"
          python -c "
          from pathlib import Path
          import color_module
          pkg_dir = Path(color_module.__file__).parent
          for f in sorted(pkg_dir.rglob('*')):
              print(f)
          "
          echo "::endgroup::"

      - name: Smoke test example module
        run: |
          python - <<'PY'
          from pathlib import Path
          import color_module

          c = color_module.Color(1, 2, 3)
          assert c.to_hex() == "#010203", f"to_hex() mismatch: got {c.to_hex()!r}"
          assert color_module.add(1, 2) == 3, f"add() mismatch: got {color_module.add(1, 2)!r}"
          assert color_module.Palette.Red == color_module.Palette.Red

          pkg_dir = Path(color_module.__file__).parent
          pyi_files = list(pkg_dir.glob("*.pyi"))
          assert pyi_files, (
              f"No .pyi stub found in {pkg_dir}. "
              f"Directory contents: {sorted(pkg_dir.iterdir())}"
          )
          print(f"All checks passed. Found stubs: {pyi_files}")
          PY

      - name: Upload wheel and stub artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-python-${{ matrix.python-version }}
          path: |
            dist/
            examples/color-module/**/*.pyi
          retention-days: 3