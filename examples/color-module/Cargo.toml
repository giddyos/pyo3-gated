[package]
name = "pyo3-gated-color-module"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "color_module"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["pyo3-gated/python"]
python-extension = ["python"]
stub-gen = ["python", "pyo3-gated/stub-gen"]
anyhow = ["python", "pyo3-gated/anyhow"]

[dependencies]
pyo3-gated = { path = "../../crates/pyo3-gated" }
anyhow = "1"

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["stub-gen"]
doc = false
